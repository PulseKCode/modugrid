<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>4-2. 헤더 체크박스로 한 번에 켜고 끄기 — ModuGrid 샘플</title>
<link rel="stylesheet" href="modugrid.min.css">
<link rel="stylesheet" href="_demo.css">
</head>
<body class="dm">
<div class="dm-page">

  <div class="dm-grp">4. 선택</div>
  <h1 class="dm-tit">4-2. 헤더 체크박스로 한 번에 켜고 끄기</h1>
  <p class="dm-desc"><code>_cb</code> 헤더의 체크박스는 세 가지 상태를 가집니다. <b>전부 체크 · 일부만 체크(중간 표시) · 전부 해제</b>. 지금 몇 개가 켜져 있는지 헤더만 보고 알 수 있습니다.</p>
  <ul class="dm-steps">
    <li>헤더 체크박스를 눌러 <b>전부 켭니다</b>.</li>
    <li>다시 눌러 <b>전부 끕니다</b>.</li>
    <li>행 하나만 켜면 헤더가 <b>중간 상태</b>로 바뀝니다.</li>
  </ul>

  <div class="dm-tb">
  <button class="db p" onclick="cnt()">체크 개수 보기</button>
  </div>
  <div id="grid" class="dm-grid"></div>

  <div id="log" class="dm-log"></div>
  <div id="src"></div>
</div>

<script src="modugrid.min.js"></script>
<script src="_demo.js"></script>

<!-- 데모 코드 원문 — MGDemo.boot() 이 주입해 실행한다 -->
<script type="text/plain" id="demo-src">
const COLS = [
  {key:'_rn', label:'#', w:42, type:'rn', noSort:1, noResize:1, noFilter:1},
  {key:'_cb', label:'',  w:36, type:'cb', noSort:1, noResize:1, noFilter:1},
  {key:'name',  label:'이름', w:130},
  {key:'role',  label:'직무', w:120},
  {key:'score', label:'점수', w:90, type:'number'},
];

const G = ModuGrid('#grid', {
  cols: COLS,
  options:{
    selMode:'row', pageSize:10,
    on:{ selectionChange: function(p){ MGDemo.log('체크 ' + p.checked.length + '건'); } }
  }
});
G.setData(MGDemo.rows(12));
window.G = G;

function cnt(){
  const c = G.getChecked();
  MGDemo.log('체크된 행 ' + c.length + '개 = [' + c.join(', ') + ']', 'ok');
}
</script>

<script>MGDemo.boot();</script>
</body>
</html>
