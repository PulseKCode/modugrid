<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>6-5. 목록에 없는 값도 입력 가능 — ModuGrid 샘플</title>
<link rel="stylesheet" href="modugrid.min.css">
<link rel="stylesheet" href="_demo.css">
</head>
<body class="dm">
<div class="dm-page">

  <div class="dm-grp">6. 목록 값</div>
  <h1 class="dm-tit">6-5. 목록에 없는 값도 입력 가능</h1>
  <p class="dm-desc">목록에 없는 글자를 쳐도 그대로 저장됩니다. 코드표에 아직 없는 값을 임시로 넣어야 할 때 막히지 않습니다. 다만 목록 자체에는 추가되지 않으므로 다음에 열면 원래 목록만 보입니다.</p>
  <ul class="dm-steps">
    <li><code>직무</code> 셀을 열고 <code>Architect</code> 를 친 뒤 <code>Enter</code>.</li>
    <li>셀에 그 값이 그대로 남습니다.</li>
    <li>같은 셀을 다시 열어 보면 목록에는 없습니다.</li>
  </ul>

  <div class="dm-tb">
  <button class="db p" onclick="vals()">저장된 값 보기</button>
  </div>
  <div id="grid" class="dm-grid"></div>

  <div id="log" class="dm-log"></div>
  <div id="src"></div>
</div>

<script src="modugrid.min.js"></script>
<script src="_demo.js"></script>

<!-- 데모 코드 원문 — MGDemo.boot() 이 주입해 실행한다 -->
<script type="text/plain" id="demo-src">
const ROLE_OPTS = MGDemo.ROLES.slice();

const COLS = [
  {key:'_rn', label:'#', w:42, type:'rn', noSort:1, noResize:1, noFilter:1},
  {key:'name', label:'이름', w:130},
  {key:'role', label:'직무', w:180, options: ROLE_OPTS},
];

const G = ModuGrid('#grid', {
  cols: COLS,
  options:{
    editMode:true, selMode:'cell', pageSize:8,
    on:{ cellEdit: function(p){ MGDemo.log('"' + p.value + '" 저장', 'ok'); } }
  }
});
G.setData(MGDemo.rows(8));
window.G = G;

function vals(){
  MGDemo.clearLog();
  MGDemo.log('목록 = ' + ROLE_OPTS.join(', ') + '  (' + ROLE_OPTS.length + '개, 변하지 않음)');
  MGDemo.log('저장값 = ' + G.getFilteredData().map(function(r){ return r.role; }).join(' / '));
}
</script>

<script>MGDemo.boot();</script>
</body>
</html>
