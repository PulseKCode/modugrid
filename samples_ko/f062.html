<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>8-4. 수정분은 바뀐 칸만 나갑니다 — ModuGrid 샘플</title>
<link rel="stylesheet" href="modugrid.min.css">
<link rel="stylesheet" href="_demo.css">
</head>
<body class="dm">
<div class="dm-page">

  <div class="dm-grp">8. 변경추적 · 전송</div>
  <h1 class="dm-tit">8-4. 수정분은 바뀐 칸만 나갑니다</h1>
  <p class="dm-desc">행 전체가 아니라 <b>실제로 값이 바뀐 칸만</b> 담깁니다(<code>id</code> 는 항상 포함). 그대로 <code>UPDATE</code> 문의 <code>SET</code> 절로 옮기면 되므로 서버 코드가 단순해집니다.</p>
  <ul class="dm-steps">
    <li>한 행에서 <code>이름</code> 하나만 고칩니다.</li>
    <li><b>전송 내용 보기</b> — 이름과 id 만 들어 있습니다.</li>
    <li>같은 행의 <code>점수</code> 도 고치면 그때 점수가 추가됩니다.</li>
  </ul>

  <div class="dm-tb">
  <button class="db p" onclick="peek()">전송 내용 보기</button>
  </div>
  <div id="grid" class="dm-grid"></div>

  <div id="log" class="dm-log"></div>
  <div id="src"></div>
</div>

<script src="modugrid.min.js"></script>
<script src="_demo.js"></script>

<!-- 데모 코드 원문 — MGDemo.boot() 이 주입해 실행한다 -->
<script type="text/plain" id="demo-src">
const COLS = [
  {key:'_rn', label:'#', w:42, type:'rn', noSort:1, noResize:1, noFilter:1},
  {key:'_st', label:'',  w:28, type:'st', noSort:1, noResize:1, noFilter:1},
  {key:'_cb', label:'',  w:36, type:'cb', noSort:1, noResize:1, noFilter:1},
  {key:'name',   label:'이름', w:130},
  {key:'status', label:'상태', w:110, options:MGDemo.STATUS},
  {key:'score',  label:'점수', w:90, type:'number'},
];

const G = ModuGrid('#grid', {
  cols: COLS,
  options:{
    editMode:true, selMode:'cell', pageSize:8, showST:true,
    on:{ cellEdit: function(){ setTimeout(peek, 0); } }
  }
});
G.setData(MGDemo.rows(6));
window.G = G;

MGDemo.log('한 행에서 이름만 고쳐 보세요');

function peek(){
  MGDemo.clearLog();
  const up = G.getChanges().updated;
  if (!up.length){ MGDemo.log('아직 수정된 행이 없습니다', 'wn'); return; }
  up.forEach(function(r){
    MGDemo.log('id=' + r.id + '  →  ' + JSON.stringify(r), 'ok');
    const cols = Object.keys(r.changes);
    MGDemo.log('   UPDATE ... SET ' + cols.map(function(k){ return k + ' = ?'; }).join(', ') + ' WHERE id = ' + r.id);
  });
}
</script>

<script>MGDemo.boot();</script>
</body>
</html>
