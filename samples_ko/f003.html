<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>1-3. 화면에서 그리드 삭제하기 — destroy() — ModuGrid 샘플</title>
<link rel="stylesheet" href="modugrid.min.css">
<link rel="stylesheet" href="_demo.css">
</head>
<body class="dm">
<div class="dm-page">

  <div class="dm-grp">1. 기본 구조</div>
  <h1 class="dm-tit">1-3. 화면에서 그리드 삭제하기 — destroy()</h1>
  <p class="dm-desc">탭을 닫거나 화면을 갈아끼울 때 <code>destroy()</code> 를 불러 주세요. 걸어 둔 이벤트와 만들어 둔 DOM을 스스로 정리하고 빠집니다. 정리하지 않고 두면 키보드 이벤트가 계속 남습니다.</p>
  <ul class="dm-steps">
    <li><b>destroy()</b> 를 누르면 그리드가 사라집니다.</li>
    <li>그 상태에서 <code>Ctrl+Z</code> 를 눌러도 아무 일이 없습니다.</li>
    <li><b>다시 만들기</b> 로 새로 생성할 수 있습니다.</li>
  </ul>

  <div class="dm-tb">
  <button class="db dr" onclick="kill()">destroy()</button>
  <button class="db p" onclick="make()">다시 만들기</button>
  </div>
  <div id="grid" class="dm-grid"></div>

  <div id="log" class="dm-log"></div>
  <div id="src"></div>
</div>

<script src="modugrid.min.js"></script>
<script src="_demo.js"></script>

<!-- 데모 코드 원문 — MGDemo.boot() 이 주입해 실행한다 -->
<script type="text/plain" id="demo-src">
const COLS = [
  {key:'_rn', label:'#',  w:42, type:'rn', noSort:1, noResize:1, noFilter:1},
  {key:'_cb', label:'',   w:36, type:'cb', noSort:1, noResize:1, noFilter:1},
  {key:'name',   label:'이름',   w:130},
  {key:'status', label:'상태',   w:100, options:MGDemo.STATUS},
  {key:'role',   label:'직무',   w:120},
  {key:'score',  label:'점수',   w:80,  type:'number'},
  {key:'salary', label:'급여',   w:120, type:'currency'},
  {key:'joined', label:'입사일', w:115, type:'date'},
];

let G = null;

function make(){
  if (G) { MGDemo.log('이미 화면에 있습니다', 'wn'); return; }
  G = ModuGrid('#grid', { cols: COLS.map(c=>({...c})), options:{ editMode:true, selMode:'cell', pageSize:8 } });
  G.setData(MGDemo.rows(10));
  window.G = G;
  MGDemo.log('생성 완료', 'ok');
}

function kill(){
  if (!G) { MGDemo.log('이미 치웠습니다', 'wn'); return; }
  G.destroy(); G = null; window.G = null;
  MGDemo.log('destroy() — 이벤트 해제 · 화면 정리 완료', 'ok');
}

make();
</script>

<script>MGDemo.boot();</script>
</body>
</html>
