<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>7-4. 오류 말풍선이 저절로 사라지는 시간 — ModuGrid 샘플</title>
<link rel="stylesheet" href="modugrid.min.css">
<link rel="stylesheet" href="_demo.css">
</head>
<body class="dm">
<div class="dm-page">

  <div class="dm-grp">7. 유효성 검사</div>
  <h1 class="dm-tit">7-4. 오류 말풍선이 저절로 사라지는 시간</h1>
  <p class="dm-desc">잘못된 값을 넣으면 <code>⚠ 메시지</code> 말풍선이 뜨고 잠시 뒤 사라집니다. 기본 3초이며 <code>errorMsgDuration</code> 으로 조절합니다. <code>0</code> 이하를 주면 사라지지 않고 계속 남습니다.</p>
  <ul class="dm-steps">
    <li><code>점수</code> 에 <code>150</code> 을 넣어 말풍선을 띄웁니다 — 3초 뒤 사라집니다.</li>
    <li><b>1초</b> 로 바꾸고 다시 해 봅니다.</li>
    <li><b>사라지지 않게</b> 로 바꾸면 계속 남아 있습니다.</li>
  </ul>

  <div class="dm-tb">
  <button class="db p" onclick="build(3000)">기본 3초</button>
  <button class="db p" onclick="build(1000)">1초</button>
  <button class="db p" onclick="build(8000)">8초</button>
  <button class="db" onclick="build(0)">사라지지 않게 (0)</button>
  </div>
  <div id="grid" class="dm-grid"></div>

  <div id="log" class="dm-log"></div>
  <div id="src"></div>
</div>

<script src="modugrid.min.js"></script>
<script src="_demo.js"></script>

<!-- 데모 코드 원문 — MGDemo.boot() 이 주입해 실행한다 -->
<script type="text/plain" id="demo-src">
const COLS = [
  {key:'_rn', label:'#', w:42, type:'rn', noSort:1, noResize:1, noFilter:1},
  {key:'name',  label:'이름', w:130},
  {key:'score', label:'점수', w:110, type:'number',
    validate: function(v){ return (v >= 0 && v <= 100) || '점수는 0~100 사이여야 합니다'; }},
];

let G = null;

function build(ms){
  if (G) G.destroy();
  G = ModuGrid('#grid', {
    cols: COLS.map(function(c){ return {...c}; }),
    options:{ editMode:true, selMode:'cell', pageSize:8, errorMsgDuration: ms }
  });
  G.setData(MGDemo.rows(8));
  window.G = G;
  MGDemo.log('errorMsgDuration = ' + ms + (ms <= 0 ? ' (계속 표시)' : 'ms') + ' — 점수에 150 을 넣어 보세요', 'ok');
}

build(3000);
</script>

<script>MGDemo.boot();</script>
</body>
</html>
