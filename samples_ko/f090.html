<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>10-8. 한 페이지에 보여줄 행 수 — ModuGrid 샘플</title>
<link rel="stylesheet" href="modugrid.min.css">
<link rel="stylesheet" href="_demo.css">
</head>
<body class="dm">
<div class="dm-page">

  <div class="dm-grp">10. 레이아웃</div>
  <h1 class="dm-tit">10-8. 한 페이지에 보여줄 행 수</h1>
  <p class="dm-desc">푸터의 <code>Per page</code> 로 10 / 25 / 50 / 100 / <b>전체</b> 중에 고릅니다. <b>전체</b>를 고르면 페이지 버튼이 사라지고 모든 행이 한 번에 나옵니다.</p>
  <ul class="dm-steps">
    <li><code>Per page</code> 를 10 → 25 → All 순으로 바꿔 봅니다.</li>
    <li>All 을 고르면 페이지 버튼이 사라집니다.</li>
    <li>버튼으로도 같은 조작이 됩니다.</li>
  </ul>

  <div class="dm-tb">
  <button class="db p" onclick="G.goPage(3);info()">3페이지로</button>
  <button class="db" onclick="G.changePS(25);info()">25개씩</button>
  <button class="db" onclick="G.changePS(0);info()">전체 보기</button>
  <button class="db" onclick="G.changePS(10);info()">10개씩</button>
  </div>
  <div id="grid" class="dm-grid"></div>

  <div id="log" class="dm-log"></div>
  <div id="src"></div>
</div>

<script src="modugrid.min.js"></script>
<script src="_demo.js"></script>

<!-- 데모 코드 원문 — MGDemo.boot() 이 주입해 실행한다 -->
<script type="text/plain" id="demo-src">
const COLS = [
  {key:'_rn', label:'#', w:42, type:'rn', noSort:1, noResize:1, noFilter:1},
  {key:'name',  label:'이름', w:130},
  {key:'role',  label:'직무', w:120},
  {key:'score', label:'점수', w:90, type:'number'},
];

const G = ModuGrid('#grid', { cols: COLS, options:{ pageSize:10 } });
G.setData(MGDemo.rows(120));
window.G = G;

function info(){
  const s = G.getState();
  MGDemo.log((s.ps === 0 ? '전체 보기' : s.ps + '개씩') + ' / ' + s.page + '페이지 / 전체 ' + s.filtered.length + '행', 'ok');
}
info();
</script>

<script>MGDemo.boot();</script>
</body>
</html>
