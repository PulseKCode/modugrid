<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>4-4. 전체 선택의 범위는 화면에 보이는 행 — ModuGrid 샘플</title>
<link rel="stylesheet" href="modugrid.min.css">
<link rel="stylesheet" href="_demo.css">
</head>
<body class="dm">
<div class="dm-page">

  <div class="dm-grp">4. 선택</div>
  <h1 class="dm-tit">4-4. 전체 선택의 범위는 화면에 보이는 행</h1>
  <p class="dm-desc">헤더 체크박스는 <b>지금 화면에 그려진 행</b>만 대상으로 합니다. 일반 페이징이면 현재 페이지, 필터가 걸려 있으면 걸러진 행만입니다. 안 보이는 행이 실수로 딸려가지 않게 하기 위한 규칙입니다.</p>
  <ul class="dm-steps">
    <li>1페이지에서 헤더 체크박스로 전부 켭니다.</li>
    <li>2페이지로 넘어가 보면 그쪽은 켜져 있지 않습니다.</li>
    <li><code>직무</code> 에 필터를 걸고 전체 선택하면 걸러진 행만 켜집니다.</li>
  </ul>

  <div class="dm-tb">
  <button class="db p" onclick="cnt()">체크 개수 보기</button>
  <button class="db" onclick="G.goPage(2);cnt()">2페이지로</button>
  <button class="db" onclick="G.goPage(1);cnt()">1페이지로</button>
  </div>
  <div id="grid" class="dm-grid"></div>

  <div id="log" class="dm-log"></div>
  <div id="src"></div>
</div>

<script src="modugrid.min.js"></script>
<script src="_demo.js"></script>

<!-- 데모 코드 원문 — MGDemo.boot() 이 주입해 실행한다 -->
<script type="text/plain" id="demo-src">
const COLS = [
  {key:'_rn', label:'#', w:42, type:'rn', noSort:1, noResize:1, noFilter:1},
  {key:'_cb', label:'',  w:36, type:'cb', noSort:1, noResize:1, noFilter:1},
  {key:'name',  label:'이름', w:130},
  {key:'role',  label:'직무', w:120},
  {key:'score', label:'점수', w:90, type:'number'},
];

const G = ModuGrid('#grid', { cols: COLS, options:{ selMode:'row', pageSize:5 } });
G.setData(MGDemo.rows(20));
window.G = G;

function cnt(){
  const s = G.getState();
  MGDemo.log(s.page + '페이지 / 전체 ' + G.getFilteredData().length + '행 중 체크 ' + G.getChecked().length + '건'
           + ' = [' + G.getChecked().join(', ') + ']', 'ok');
}
cnt();
</script>

<script>MGDemo.boot();</script>
</body>
</html>
