<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>5.1-5. Enter — 아래 칸으로 / Esc — 되돌리기 — ModuGrid 샘플</title>
<link rel="stylesheet" href="modugrid.min.css">
<link rel="stylesheet" href="_demo.css">
</head>
<body class="dm">
<div class="dm-page">

  <div class="dm-grp">5.1 진입 경로</div>
  <h1 class="dm-tit">5.1-5. Enter — 아래 칸으로 / Esc — 되돌리기</h1>
  <p class="dm-desc"><code>Enter</code> 는 저장하고 아래 칸으로, <code>Shift+Enter</code> 는 위로 갑니다. <code>Esc</code> 를 누르면 지금 친 내용을 버리고 원래 값으로 되돌립니다.</p>
  <ul class="dm-steps">
    <li><code>점수</code> 셀을 편집하고 <code>Enter</code> — 아래로 내려갑니다.</li>
    <li>다른 셀을 고치다가 <code>Esc</code> 를 눌러 봅니다 — 원래 값으로 돌아옵니다.</li>
    <li>한 열을 위에서 아래로 쭉 입력할 때 편합니다.</li>
  </ul>

  <div class="dm-tb">
  <button class="db p" onclick="dump()">현재 값 보기</button>
  </div>
  <div id="grid" class="dm-grid"></div>

  <div id="log" class="dm-log"></div>
  <div id="src"></div>
</div>

<script src="modugrid.min.js"></script>
<script src="_demo.js"></script>

<!-- 데모 코드 원문 — MGDemo.boot() 이 주입해 실행한다 -->
<script type="text/plain" id="demo-src">
const COLS = [
  {key:'_rn', label:'#', w:42, type:'rn', noSort:1, noResize:1, noFilter:1},
  {key:'_st', label:'',  w:28, type:'st', noSort:1, noResize:1, noFilter:1},
  {key:'name',   label:'이름',   w:130},
  {key:'status', label:'상태',   w:110, options:MGDemo.STATUS},
  {key:'score',  label:'점수',   w:90,  type:'number'},
  {key:'joined', label:'입사일', w:120, type:'date'},
  {key:'memo',   label:'메모',   w:180, type:'textarea'},
];

const G = ModuGrid('#grid', {
  cols: COLS,
  options:{
    editMode:true, selMode:'cell', pageSize:8,
    on:{ cellEdit: function(p){ MGDemo.log(p.key + ' = ' + p.value + ' 저장', 'ok'); } }
  }
});
G.setData(MGDemo.rows(8));
window.G = G;

function dump(){
  MGDemo.clearLog();
  G.getFilteredData().slice(0,5).forEach(function(r){
    MGDemo.log('id=' + r.id + '  이름 "' + r.name + '"  점수 ' + r.score);
  });
}
</script>

<script>MGDemo.boot();</script>
</body>
</html>
