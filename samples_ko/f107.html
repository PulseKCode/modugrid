<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>14-3. 사진 넣고 빼기 — ModuGrid 샘플</title>
<link rel="stylesheet" href="modugrid.min.css">
<link rel="stylesheet" href="_demo.css">
</head>
<body class="dm">
<div class="dm-page">

  <div class="dm-grp">14. 기타</div>
  <h1 class="dm-tit">14-3. 사진 넣고 빼기</h1>
  <p class="dm-desc"><code>type:'images'</code> 컬럼에 사진을 넣습니다. <code>＋ Add</code> 로 고르거나 <b>파일을 칸 위로 끌어다 놓으면</b> 됩니다. 파일 이름에 마우스를 올리면 크게 볼 수 있고 <code>✕</code> 로 하나씩 지웁니다.</p>
  <ul class="dm-steps">
    <li><code>사진</code> 칸의 <code>＋ Add</code> 로 이미지를 고릅니다.</li>
    <li>탐색기에서 이미지를 칸 위로 <b>끌어다 놓아</b> 봅니다.</li>
    <li>파일 이름에 마우스를 올려 미리보기를 확인합니다.</li>
    <li><code>✕</code> 로 한 장만 지워 봅니다.</li>
  </ul>

  <div class="dm-tb">
  <button class="db p" onclick="cnt()">칸별 장수 보기</button>
  </div>
  <div id="grid" class="dm-grid"></div>

  <div id="log" class="dm-log"></div>
  <div id="src"></div>
</div>

<script src="modugrid.min.js"></script>
<script src="_demo.js"></script>

<!-- 데모 코드 원문 — MGDemo.boot() 이 주입해 실행한다 -->
<script type="text/plain" id="demo-src">
const COLS = [
  {key:'_rn', label:'#', w:42, type:'rn', noSort:1, noResize:1, noFilter:1},
  {key:'name',   label:'이름', w:130},
  {key:'images', label:'사진', w:280, type:'images'},
  {key:'role',   label:'직무', w:120},
];

const G = ModuGrid('#grid', {
  cols: COLS,
  options:{ editMode:true, pageSize:5, rowHeight:70, imageLimit:5, imageMaxSize:2*1024*1024 }
});
G.setData(MGDemo.rows(4));
window.G = G;

MGDemo.log('사진을 칸 위로 끌어다 놓거나 ＋ Add 를 눌러 보세요');

function cnt(){
  MGDemo.clearLog();
  G.getFilteredData().forEach(function(r){
    MGDemo.log('id=' + r.id + '  ' + (r.images||[]).length + '장');
  });
}
</script>

<script>MGDemo.boot();</script>
</body>
</html>
