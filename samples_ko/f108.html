<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>14-4. 사진 전송 방식 고르기 — ModuGrid 샘플</title>
<link rel="stylesheet" href="modugrid.min.css">
<link rel="stylesheet" href="_demo.css">
</head>
<body class="dm">
<div class="dm-page">

  <div class="dm-grp">14. 기타</div>
  <h1 class="dm-tit">14-4. 사진 전송 방식 고르기</h1>
  <p class="dm-desc">사진을 서버에 <b>언제, 어떤 형태로</b> 보낼지는 <code>imageMode</code> 로 정합니다. 네 가지 방식과 서버 코드 예시는 <b>8.1 이미지 전송</b> 항목에서 하나씩 다룹니다.</p>
  <ul class="dm-steps">
    <li>아래 선택 상자로 방식을 바꿔 가며 전송 내용이 어떻게 달라지는지 봅니다.</li>
    <li>사진을 넣고 <b>전송 내용 보기</b> 를 누릅니다.</li>
    <li>자세한 설명과 서버 코드는 8.1 항목을 참고하세요.</li>
  </ul>

  <div class="dm-tb">
  <span class="dm-lab">전송 방식</span>
  <select class="dm-in" id="m" onchange="build(this.value)">
    <option value="none">none — 보내지 않음</option>
    <option value="multipart">multipart — 저장할 때 파일까지</option>
    <option value="base64">base64 — 문자열로 담기</option>
  </select>
  <button class="db p" onclick="peek()">전송 내용 보기</button>
  </div>
  <div id="grid" class="dm-grid"></div>

  <div id="log" class="dm-log"></div>
  <div id="src"></div>
</div>

<script src="modugrid.min.js"></script>
<script src="_demo.js"></script>

<!-- 데모 코드 원문 — MGDemo.boot() 이 주입해 실행한다 -->
<script type="text/plain" id="demo-src">
const COLS = [
  {key:'_rn', label:'#', w:42, type:'rn', noSort:1, noResize:1, noFilter:1},
  {key:'_st', label:'',  w:28, type:'st', noSort:1, noResize:1, noFilter:1},
  {key:'name',   label:'이름', w:130},
  {key:'images', label:'사진', w:280, type:'images'},
];

let G = null;

function build(mode){
  if (G) G.destroy();
  G = ModuGrid('#grid', {
    cols: COLS.map(function(c){ return {...c}; }),
    options:{ editMode:true, pageSize:4, rowHeight:80, showST:true,
              imageMode: mode, imageLimit:3, imageMaxSize:200*1024 }
  });
  G.setData(MGDemo.rows(3));
  window.G = G;
  MGDemo.log('전송 방식 = ' + mode + ' — 사진을 넣고 전송 내용을 확인해 보세요', 'ok');
}

function peek(){
  MGDemo.clearLog();
  const ch = G.getChanges();
  const all = ch.updated.concat(ch.inserted);
  if (!all.length){ MGDemo.log('먼저 사진을 넣어 보세요', 'wn'); return; }
  const s = JSON.stringify(all);
  MGDemo.log(s.length > 500 ? s.slice(0,500) + ' … (생략)' : s);
}

build('none');
</script>

<script>MGDemo.boot();</script>
</body>
</html>
