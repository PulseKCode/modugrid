<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>8.1-5. upload — imageUpload 함수는 필수 — ModuGrid 샘플</title>
<link rel="stylesheet" href="modugrid.min.css">
<link rel="stylesheet" href="_demo.css">
</head>
<body class="dm">
<div class="dm-page">

  <div class="dm-grp">8.1 이미지 전송</div>
  <h1 class="dm-tit">8.1-5. upload — imageUpload 함수는 필수</h1>
  <p class="dm-desc"><code>upload</code> 방식을 쓰면서 <code>imageUpload</code> 를 빠뜨리면 <b>아무것도 올라가지 않습니다</b>. 개발자 도구 콘솔에 경고가 남으니, 사진이 올라가지 않을 때는 이것부터 확인하세요.</p>
  <ul class="dm-steps">
    <li>왼쪽에는 <code>imageUpload</code> 를 넣었고, 오른쪽은 빠뜨렸습니다.</li>
    <li>양쪽 <code>사진</code> 칸에 이미지를 넣어 봅니다.</li>
    <li>오른쪽은 진행되지 않고 브라우저 콘솔(F12)에 경고가 남습니다.</li>
  </ul>

  
  <div class="dm-two">
    <div><div class="dm-cap">imageUpload 있음 — 정상</div><div id="gA"></div></div>
    <div><div class="dm-cap">imageUpload 없음 — 동작 안 함</div><div id="gB"></div></div>
  </div>

  <div id="log" class="dm-log"></div>
  <div id="src"></div>
</div>

<script src="modugrid.min.js"></script>
<script src="_demo.js"></script>

<!-- 데모 코드 원문 — MGDemo.boot() 이 주입해 실행한다 -->
<script type="text/plain" id="demo-src">
const COLS = [
  {key:'_rn', label:'#', w:42, type:'rn', noSort:1, noResize:1, noFilter:1},
  {key:'_st', label:'',  w:28, type:'st', noSort:1, noResize:1, noFilter:1},
  {key:'name',   label:'이름', w:130},
  {key:'images', label:'사진', w:280, type:'images'},
];

let no = 0;

const G1 = ModuGrid('#gA', {
  cols: COLS.map(function(c){ return {...c}; }),
  options:{
    editMode:true, pageSize:3, rowHeight:80, imageMode:'upload',
    imageUpload: function(file, row){
      MGDemo.log('왼쪽 업로드 — ' + file.name, 'wn');
      return new Promise(function(res){
        setTimeout(function(){
          const id = 'F' + (++no);
          MGDemo.log('왼쪽 완료 — ' + id, 'ok');
          res({ id:id, url:'/files/' + id + '.jpg' });
        }, 600);
      });
    }
  }
});

/* imageUpload 를 일부러 빼놓은 경우 */
const G2 = ModuGrid('#gB', {
  cols: COLS.map(function(c){ return {...c}; }),
  options:{ editMode:true, pageSize:3, rowHeight:80, imageMode:'upload' }
});

G1.setData(MGDemo.rows(3, 2));
G2.setData(MGDemo.rows(3, 2));
window.G1 = G1; window.G2 = G2;

MGDemo.log('오른쪽에 사진을 넣고 브라우저 콘솔(F12)을 확인해 보세요');
</script>

<script>MGDemo.boot();</script>
</body>
</html>
