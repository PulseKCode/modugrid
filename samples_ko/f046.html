<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>5.3-4. 행 순서 바꾸기 · 행 높이 조절 — ModuGrid 샘플</title>
<link rel="stylesheet" href="modugrid.min.css">
<link rel="stylesheet" href="_demo.css">
</head>
<body class="dm">
<div class="dm-page">

  <div class="dm-grp">5.3 입력 제어</div>
  <h1 class="dm-tit">5.3-4. 행 순서 바꾸기 · 행 높이 조절</h1>
  <p class="dm-desc"><code>#</code> 칸을 잡고 위아래로 끌면 행 순서가 바뀝니다. 같은 칸의 <b>아래 경계</b>를 끌면 그 행만 높아져, 메모가 긴 행을 넓게 볼 수 있습니다.</p>
  <ul class="dm-steps">
    <li><code>#</code> 칸을 잡고 위아래로 끌어 순서를 바꿉니다.</li>
    <li><code>#</code> 칸의 <b>아래 경계선</b>을 잡고 아래로 끕니다 — 그 행만 높아집니다.</li>
    <li>정렬이 걸려 있으면 순서 바꾸기는 동작하지 않습니다 (정렬 기준이 우선이라서).</li>
  </ul>

  <div class="dm-tb">
  <button class="db p" onclick="mv()">1번 행을 4번 자리로</button>
  <button class="db" onclick="G.setRowHeight(2,70)">2번 행 높이 70px</button>
  <button class="db" onclick="G.setRowHeight(2,null)">2번 행 원래대로</button>
  <button class="db" onclick="G.setRowHeight(null,40)">전체 기본 높이 40px</button>
  </div>
  <div id="grid" class="dm-grid"></div>

  <div id="log" class="dm-log"></div>
  <div id="src"></div>
</div>

<script src="modugrid.min.js"></script>
<script src="_demo.js"></script>

<!-- 데모 코드 원문 — MGDemo.boot() 이 주입해 실행한다 -->
<script type="text/plain" id="demo-src">
const COLS = [
  {key:'_rn', label:'#', w:42, type:'rn', noSort:1, noResize:1, noFilter:1},
  {key:'name',  label:'이름', w:130},
  {key:'role',  label:'직무', w:120},
  {key:'memo',  label:'메모', w:220},
];

const G = ModuGrid('#grid', { cols: COLS, options:{ pageSize:10, rowHeight:25 } });
G.setData(MGDemo.rows(8));
window.G = G;

function mv(){
  const ok = G.moveRow(1, 4);
  MGDemo.log(ok ? '순서 변경 완료 → [' + G.getState().data.map(function(r){ return r.id; }).join(', ') + ']'
                : '정렬이 걸려 있어 순서를 바꿀 수 없습니다', ok ? 'ok' : 'wn');
}
</script>

<script>MGDemo.boot();</script>
</body>
</html>
