<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>10-1. 컬럼 폭 조절 — ModuGrid 샘플</title>
<link rel="stylesheet" href="modugrid.min.css">
<link rel="stylesheet" href="_demo.css">
</head>
<body class="dm">
<div class="dm-page">

  <div class="dm-grp">10. 레이아웃</div>
  <h1 class="dm-tit">10-1. 컬럼 폭 조절</h1>
  <p class="dm-desc">헤더 오른쪽 경계를 잡고 끌면 폭이 바뀝니다. 바꾼 폭은 <code>getLayout()</code> 으로 저장해 두었다가 다음에 그대로 복원할 수 있습니다.</p>
  <ul class="dm-steps">
    <li><code>이름</code> 헤더 오른쪽 경계를 잡고 좌우로 끕니다.</li>
    <li><code>#</code> 헤더는 <code>noResize:1</code> 이라 조절되지 않습니다.</li>
    <li><b>현재 폭 보기</b> 로 값을 확인합니다.</li>
  </ul>

  <div class="dm-tb">
  <button class="db p" onclick="widths()">현재 폭 보기</button>
  </div>
  <div id="grid" class="dm-grid"></div>

  <div id="log" class="dm-log"></div>
  <div id="src"></div>
</div>

<script src="modugrid.min.js"></script>
<script src="_demo.js"></script>

<!-- 데모 코드 원문 — MGDemo.boot() 이 주입해 실행한다 -->
<script type="text/plain" id="demo-src">
const COLS = [
  {key:'_rn', label:'#', w:42, type:'rn', noSort:1, noResize:1, noFilter:1},
  {key:'name',  label:'이름', w:130},
  {key:'role',  label:'직무', w:120},
  {key:'memo',  label:'메모', w:180},
  {key:'score', label:'점수', w:90, type:'number'},
];

const G = ModuGrid('#grid', { cols: COLS, options:{ pageSize:10 } });
G.setData(MGDemo.rows(10));
window.G = G;

function widths(){
  MGDemo.clearLog();
  const w = G.getLayout().widths;
  Object.keys(w).forEach(function(k){ MGDemo.log(k.padEnd(8) + w[k] + 'px'); });
}
</script>

<script>MGDemo.boot();</script>
</body>
</html>
