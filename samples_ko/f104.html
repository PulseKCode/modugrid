<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>13-3. 같은 조회는 다시 묻지 않습니다 — ModuGrid 샘플</title>
<link rel="stylesheet" href="modugrid.min.css">
<link rel="stylesheet" href="_demo.css">
</head>
<body class="dm">
<div class="dm-page">

  <div class="dm-grp">13. 서버 연동</div>
  <h1 class="dm-tit">13-3. 같은 조회는 다시 묻지 않습니다</h1>
  <p class="dm-desc">필터 팝업의 값 목록(<code>filterSource</code>)과 자동완성(<code>acSource</code>)은 받아 온 결과를 기억해 둡니다. 같은 조건이면 서버를 다시 부르지 않아 <b>불필요한 조회가 줄어듭니다</b>.</p>
  <ul class="dm-steps">
    <li><code>직무</code> 깔때기를 열었다 닫았다 반복합니다 — 조회 횟수가 늘지 않습니다.</li>
    <li>검색어를 바꾸면 조건이 달라져 다시 조회합니다.</li>
    <li><code>도시</code> 칸을 편집하며 같은 글자를 반복해 쳐도 마찬가지입니다.</li>
  </ul>

  <div class="dm-tb">
  <span class="dm-lab">검색</span>
  <input class="dm-in" id="q" placeholder="조건 바꾸기" oninput="G.search(this.value)">
  <button class="db p" onclick="calls()">서버 조회 내역</button>
  <button class="db" onclick="reset_()">내역 지우기</button>
  </div>
  <div id="grid" class="dm-grid"></div>

  <div id="log" class="dm-log"></div>
  <div id="src"></div>
</div>

<script src="modugrid.min.js"></script>
<script src="_demo.js"></script>

<!-- 데모 코드 원문 — MGDemo.boot() 이 주입해 실행한다 -->
<script type="text/plain" id="demo-src">
const ALL = MGDemo.rows(60);
const CITY = ['서울','부산','대구','인천','광주','대전','울산','세종'];
ALL.forEach(function(r,i){ r.city = CITY[i % CITY.length]; });

let flt = [], ac = [];

const COLS = [
  {key:'_rn',  label:'#', w:42, type:'rn', noSort:1, noResize:1, noFilter:1},
  {key:'name', label:'이름', w:130},
  {key:'role', label:'직무', w:130},
  {key:'city', label:'도시', w:160},
];

const G = ModuGrid('#grid', {
  cols: COLS,
  options:{
    pageSize: 10, editMode:true, selMode:'cell', acDebounce:200,

    dataSource: function(req){
      let rows = ALL.slice();
      if (req.search) rows = rows.filter(function(r){ return (r.name+r.role).toLowerCase().indexOf(req.search)>=0; });
      Object.keys(req.filters||{}).forEach(function(k){
        const f = req.filters[k];
        if (f.type==='list') rows = rows.filter(function(r){ return f.values.indexOf(String(r[k]))>=0; });
      });
      const st = (req.page-1)*req.pageSize;
      return Promise.resolve({ rows: rows.slice(st, st+req.pageSize), total: rows.length });
    },

    /* 필터 팝업의 값 목록 — 이미 받아 둔 조건이면 호출되지 않는다 */
    filterSource: function(colKey, req){
      flt.push(colKey + ' / "' + (req.search||'') + '"');
      MGDemo.log('필터 목록 조회 ' + flt.length + '회 — ' + colKey, 'wn');
      const vals = [...new Set(ALL.map(function(r){ return String(r[colKey]); }))].sort();
      return new Promise(function(res){ setTimeout(function(){ res(vals); }, 250); });
    },

    /* 자동완성 — 마찬가지로 기억해 둔다 */
    acSource: function(colKey, q){
      ac.push(q);
      MGDemo.log('자동완성 조회 ' + ac.length + '회 — "' + q + '"', 'wn');
      return new Promise(function(res){
        setTimeout(function(){ res(CITY.filter(function(v){ return v.indexOf(q)>=0; })); }, 200);
      });
    }
  }
});
window.G = G;

function calls(){
  MGDemo.clearLog();
  MGDemo.log('필터 목록 조회 ' + flt.length + '회', 'ok');
  flt.forEach(function(x,i){ MGDemo.log('  ' + (i+1) + '. ' + x); });
  MGDemo.log('자동완성 조회 ' + ac.length + '회', 'ok');
  ac.forEach(function(x,i){ MGDemo.log('  ' + (i+1) + '. "' + x + '"'); });
}
function reset_(){ flt=[]; ac=[]; MGDemo.clearLog(); MGDemo.log('내역 지움', 'ok'); }
</script>

<script>MGDemo.boot();</script>
</body>
</html>
