<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>4-3. 행을 켜면 헤더 표시가 바로 따라옴 — ModuGrid 샘플</title>
<link rel="stylesheet" href="modugrid.min.css">
<link rel="stylesheet" href="_demo.css">
</head>
<body class="dm">
<div class="dm-page">

  <div class="dm-grp">4. 선택</div>
  <h1 class="dm-tit">4-3. 행을 켜면 헤더 표시가 바로 따라옴</h1>
  <p class="dm-desc">행 체크박스를 하나씩 켜고 끌 때마다 헤더 표시가 즉시 반영됩니다. 전부 켜면 헤더도 완전히 켜지고, 하나라도 빠지면 중간 상태로 돌아갑니다.</p>
  <ul class="dm-steps">
    <li>행 체크박스를 하나씩 전부 켭니다 — 마지막 하나를 켜는 순간 헤더가 완전히 켜집니다.</li>
    <li>아무 행이나 하나를 끕니다 — 헤더가 중간 상태로 바뀝니다.</li>
    <li>전부 끄면 헤더도 해제됩니다.</li>
  </ul>

  <div class="dm-tb">
  <button class="db p" onclick="cnt()">지금 상태</button>
  </div>
  <div id="grid" class="dm-grid"></div>

  <div id="log" class="dm-log"></div>
  <div id="src"></div>
</div>

<script src="modugrid.min.js"></script>
<script src="_demo.js"></script>

<!-- 데모 코드 원문 — MGDemo.boot() 이 주입해 실행한다 -->
<script type="text/plain" id="demo-src">
const COLS = [
  {key:'_rn', label:'#', w:42, type:'rn', noSort:1, noResize:1, noFilter:1},
  {key:'_cb', label:'',  w:36, type:'cb', noSort:1, noResize:1, noFilter:1},
  {key:'name',  label:'이름', w:130},
  {key:'role',  label:'직무', w:120},
  {key:'score', label:'점수', w:90, type:'number'},
];

const G = ModuGrid('#grid', {
  cols: COLS,
  options:{
    selMode:'row', pageSize:8,
    on:{ selectionChange: function(p){ cnt(); } }
  }
});
G.setData(MGDemo.rows(8));
window.G = G;

function cnt(){
  const c = G.getChecked().length;
  const all = G.getFilteredData().length;
  MGDemo.log('체크 ' + c + ' / 전체 ' + all + '  →  헤더 상태: '
           + (c === 0 ? '해제' : c === all ? '전부 체크' : '중간(일부 체크)'),
             c === all ? 'ok' : '');
}
</script>

<script>MGDemo.boot();</script>
</body>
</html>
