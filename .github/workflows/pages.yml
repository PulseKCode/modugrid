name: Deploy demo

# Publishes demo/ to GitHub Pages.
#
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
# Nothing else — no tokens, no secrets, no external account.
#
# demo/ is generated here rather than committed, so the published examples always
# match the source in the same commit.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish Pages. Nothing else is granted.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run supersedes the previous one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # The demo ships the minified build, so it has to exist first.
      - name: Build the library
        run: npm run build

      - name: Assemble the demo
        run: npm run demo

      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
